services:
  mysql:
    image: mysql:8.4
    container_name: lab-reservation-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: lab_reservation_db
    ports:
      - "3307:3306"
    volumes:
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql

  app:
    build: .
    container_name: lab-reservation-api
    depends_on:
      - mysql
    environment:
      DB_URL: jdbc:mysql://mysql:3306/lab_reservation_db?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: 123456
    ports:
      - "8080:8080"